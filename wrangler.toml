name = "hust-photo-album"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "my-media-bucket" 
# 注意：请确保这里的 bucket_name 与您实际创建的 R2 桶名称一致

[vars]
# 这些是默认值，建议在 Cloudflare 后台设置环境变量以保护隐私
ACCESS_PASSWORD = "your_access_password"
ADMIN_PASSWORD = "your_admin_password"
ALBUM_1 = "班级活动"
ALBUM_2 = "学习资料"
ALBUM_3 = "生活点滴"
ALBUM_4 = "实验项目"
ALBUM_5 = "毕业留念"
